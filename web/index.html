<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<title>Тестирование</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23111'/%3E%3Cpath d='M10 16.5l4 4 8-9' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500&family=Onest:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7f8;--card:#fff;--fg:#0b0b0c;--mu:#6e6e73;--fa:#a1a1a6;--ln:#ebebed;--sf:#f2f2f4;--ok:#1a7f37;--no:#c62828;--sh:0 1px 2px rgba(16,16,20,.04),0 4px 16px rgba(16,16,20,.04);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0c;--card:#141416;--fg:#f2f2f3;--mu:#8e8e93;--fa:#5c5c60;--ln:#232326;--sf:#1c1c1f;--ok:#3fb950;--no:#f0605a;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b0c;--card:#141416;--fg:#f2f2f3;--mu:#8e8e93;--fa:#5c5c60;--ln:#232326;--sf:#1c1c1f;--ok:#3fb950;--no:#f0605a;--sh:none;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 Onest,ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
svg{display:block}
.U{font-family:Geologica,Onest,sans-serif}
#app{max-width:620px;margin:0 auto;min-height:100vh;padding:0 16px 40px}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;height:60px;padding-top:env(safe-area-inset-top);margin:0 -16px 20px;padding-left:16px;padding-right:16px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--ln)}
.bk,.logo,.ib{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--ln);background:var(--card);transition:background .15s}
.bk:hover,.ib:hover{background:var(--sf)}
.logo{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bk svg,.logo svg,.ib svg{width:18px;height:18px}
.ttl{flex:1;min-width:0;font-family:Geologica,Onest,sans-serif;font-size:14px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{flex:none;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu);font-variant-numeric:tabular-nums}
.tm.low{color:var(--no)}
h1{font-family:Geologica,Onest,sans-serif;font-size:26px;font-weight:400;letter-spacing:-.03em;line-height:1.2}
h2{font-family:Geologica,Onest,sans-serif;font-size:18px;font-weight:400;letter-spacing:-.02em;line-height:1.45}
.sub{color:var(--mu);margin-top:6px}
.sec{font-size:11px;color:var(--fa);text-transform:uppercase;letter-spacing:.12em;margin:26px 2px 10px;font-weight:500}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:18px;box-shadow:var(--sh)}
.stack{display:grid;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;box-shadow:var(--sh);transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--fa)}
.tile:active{transform:scale(.99)}
.tile.v{flex-direction:column;align-items:flex-start;gap:16px;padding:18px}
.tile .tx{flex:1;min-width:0}
.tile .t1{display:block;font-weight:500}
.tile .t2{display:block;font-size:13px;color:var(--mu);margin-top:1px}
.tile .ch{flex:none;color:var(--fa)}.tile .ch svg{width:16px;height:16px}
.tile.on{border-color:var(--fg)}
.ic{flex:none;width:42px;height:42px;border-radius:13px;background:var(--sf);display:grid;place-items:center}
.ic svg{width:20px;height:20px}
.num{flex:none;width:42px;height:42px;border-radius:13px;background:var(--sf);display:grid;place-items:center;font-family:Geologica,Onest,sans-serif;font-weight:300;font-size:13px;color:var(--mu)}
.flag{flex:none;width:30px;height:20px;border-radius:5px;overflow:hidden;box-shadow:0 0 0 1px var(--ln)}
.flag svg{width:100%;height:100%}
.ic .flag{width:26px;height:17px;border-radius:4px}
.av{flex:none;width:48px;height:48px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:Geologica,Onest,sans-serif;font-size:15px;font-weight:400}
.prof{display:flex;align-items:center;gap:14px}
.prof .nm{font-family:Geologica,Onest,sans-serif;font-size:16px;font-weight:400;letter-spacing:-.015em}
.lbl{display:block;font-size:12px;color:var(--mu);margin:16px 2px 6px;font-weight:500}
.in{width:100%;height:48px;padding:0 14px;border:1px solid var(--ln);border-radius:12px;background:var(--card);outline:0;transition:border-color .15s}
textarea.in{height:auto;min-height:88px;padding:12px 14px;resize:vertical;line-height:1.5}
.in:focus{border-color:var(--fg)}
.in::placeholder{color:var(--fa)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 19px) 21px,calc(100% - 14px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:500;transition:opacity .15s}
.btn:disabled{opacity:.35;cursor:default}
.btn.gh{background:var(--card);color:var(--fg);border:1px solid var(--ln)}
.btn.dg{background:transparent;color:var(--no);border:1px solid var(--ln)}
.btn.sm{height:38px;width:auto;padding:0 14px;font-size:14px;border-radius:10px}
.btn svg{width:16px;height:16px}
.mt16{margin-top:16px}.mt20{margin-top:20px}
.err{color:var(--no);font-size:13px;margin-top:12px;min-height:20px}
.okm{color:var(--ok);font-size:13px;margin-top:12px}
.seg{display:flex;gap:2px;padding:3px;background:var(--sf);border-radius:12px;border:1px solid var(--ln)}
.seg>*{flex:1;height:36px;border-radius:9px;color:var(--mu);font-size:14px;font-weight:500;display:grid;place-items:center;transition:background .15s,color .15s}
.seg .on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px var(--ln)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 2px 20px}
.hero .logo{width:44px;height:44px;border-radius:13px;margin-bottom:4px}.hero .logo svg{width:20px;height:20px}
.hero h1{font-size:20px;letter-spacing:-.02em}.hero .sub{margin:0;font-size:13px}
.seg>* svg{width:15px;height:15px;flex:none}.seg>a{display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px}
.langs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.lng{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--card);text-align:left;font-size:14px;font-weight:500;transition:border-color .15s}
.lng.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.empty{color:var(--mu);padding:28px 8px;text-align:center;font-size:14px}
.ld{color:var(--fa);padding:40px 0;text-align:center;font-size:14px}
/* test */
.prog{margin:-8px 0 22px}.bar2{height:3px;border-radius:3px;background:var(--ln);overflow:hidden}.bar2 i{display:block;height:100%;background:var(--fg);transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-bottom:8px;font-variant-numeric:tabular-nums}
.qc{padding:22px 18px}
.hint{color:var(--mu);font-size:13px;margin:8px 0 16px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--ln);border-radius:12px;margin-top:8px;background:var(--card);transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--fa)}
.opt.sel{border-color:var(--fg);background:var(--sf)}
.box{flex:none;width:18px;height:18px;border:1.5px solid var(--fa);margin-top:2px;display:grid;place-items:center}
.r .box{border-radius:50%}.c .box{border-radius:5px}
.sel .box{border-color:var(--fg);background:var(--fg)}
.sel.r .box::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--card)}
.sel.c .box::after{content:"";width:8px;height:4px;border:solid var(--card);border-width:0 0 1.5px 1.5px;transform:translateY(-1px) rotate(-45deg)}
.no_{flex:none;display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:6px;background:var(--sf);color:var(--mu);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.mtb{border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.mrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-top:1px solid var(--ln);background:var(--card);transition:background .15s}
.mrow:first-child{border-top:0}
.mrow .ml{flex:1;font-weight:500;min-width:0}
.mrow .mv{flex:none;max-width:48%;text-align:right;color:var(--fa);font-size:14px}
.mrow.fil .mv{color:var(--fg)}
.mrow.on{background:var(--sf);box-shadow:inset 3px 0 0 var(--fg)}
.mrow.on .no_,.chip.mine .no_,.mrow.fil .no_{background:var(--fg);color:var(--card)}
.plbl{font-size:12px;color:var(--mu);margin:20px 2px 8px;font-weight:500}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:10px 14px;border:1px solid var(--ln);border-radius:12px;text-align:left;background:var(--card);transition:border-color .15s,background .15s,opacity .15s}
.chip:hover{border-color:var(--fa)}
.chip.used{opacity:.45}
.chip.mine{opacity:1;border-color:var(--fg);background:var(--sf)}
.nav{display:flex;gap:10px;margin-top:16px}
.pg{display:flex;flex-wrap:wrap;gap:6px}
.pg button{width:36px;height:36px;border-radius:10px;font-size:13px;color:var(--fa);border:1px solid var(--ln);background:var(--card);font-variant-numeric:tabular-nums}
.pg button.dn{color:var(--fg);background:var(--sf);border-color:var(--sf)}
.pg button.cur{border-color:var(--fg);color:var(--fg)}
/* done */
.big{font-family:Geologica,Onest,sans-serif;font-size:56px;font-weight:300;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:22px;color:var(--fa);letter-spacing:0}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.kv span{background:var(--sf);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--mu)}
.kv b{display:block;font-size:16px;color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.rv{padding:14px 0;border-top:1px solid var(--ln)}.rv:first-child{border-top:0;padding-top:0}
.rv .q{font-weight:500;display:flex;gap:10px;justify-content:space-between}
.rv .q span{flex:none;font-size:12px;font-weight:500}
.ok{color:var(--ok)}.no{color:var(--no)}
.rl{font-size:14px;margin-top:6px;color:var(--mu);display:flex;gap:10px}
.rl i{font-style:normal;width:14px;flex:none}
.rl.ok,.rl.ok i{color:var(--ok)}.rl.no,.rl.no i{color:var(--no)}
/* results */
.srch{position:relative}
.srch svg{position:absolute;left:14px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--fa);pointer-events:none}
.srch .in{padding-left:40px;-webkit-appearance:none}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.filters .in{height:42px;font-size:14px}
.filters .in:nth-child(3){grid-column:1/-1}
.cnt{font-size:12px;color:var(--fa);margin:14px 2px 8px}
.rrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln)}
.rrow:first-child{border-top:0;padding-top:0}.rrow:last-child{padding-bottom:0}
.rrow .tx{flex:1;min-width:0}.rrow .t1{display:block;font-weight:500}.rrow .t2{display:block;font-size:12px;color:var(--mu);margin-top:1px}
.sc{flex:none;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--mu)}
.gr{flex:none;min-width:58px;padding:6px 10px;border-radius:12px;background:var(--sf);text-align:center;line-height:1.15}
.gr small{display:block;font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
.gr b{font-family:Geologica,Onest,sans-serif;font-size:16px;font-weight:400}.gr b i{font-style:normal;font-size:11px;color:var(--fa)}
.note{font-size:12px;color:var(--fa);margin:16px 2px 0}
/* admin */
.tag{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--sf);color:var(--mu)}
.qrow{display:flex;gap:12px;align-items:flex-start}
.qrow .tx{flex:1;min-width:0}
.qrow .qt{margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.acts{display:flex;gap:6px;margin-top:12px}
.acts .ib{width:34px;height:34px;border-radius:10px}.acts .ib svg{width:15px;height:15px}
.acts .ib.dgr{color:var(--no)}
.erow{display:flex;gap:8px;align-items:center;margin-top:8px}
.erow .in{height:44px}
.erow .tg{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);display:grid;place-items:center;background:var(--card);color:var(--fa)}
.erow .tg.on{background:var(--fg);border-color:var(--fg);color:var(--card)}
.erow .tg svg{width:16px;height:16px}
.erow .x{flex:none;width:36px;height:44px;display:grid;place-items:center;color:var(--fa)}
.erow .x svg{width:16px;height:16px}
.erow .ar{flex:none;color:var(--fa)}
.add3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.add3 .btn{height:auto;min-height:48px;padding:8px;font-size:13px;flex-direction:column;gap:4px}
.sup{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;border:1px solid color-mix(in srgb,#25D366 35%,var(--ln));background:color-mix(in srgb,#25D366 7%,var(--card));transition:transform .15s,border-color .15s}
.sup:hover{border-color:#25D366}.sup:active{transform:scale(.99)}
.sup .wa{flex:none;width:44px;height:44px;border-radius:14px;background:#25D366;color:#25D366;display:grid;place-items:center;box-shadow:0 6px 18px -6px rgba(37,211,102,.7)}
.sup .wa svg{width:26px;height:26px;color:#fff}
.sup .wa svg path:last-child{fill:#25D366}
.sup .tx{flex:1;min-width:0}.sup .t1{display:block;font-weight:500}.sup .t2{display:block;font-size:13px;color:var(--mu)}
.sup .ch{color:var(--fa)}.sup .ch svg{width:16px;height:16px}
.lo2{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:42px;margin-top:16px;border-radius:12px;border:1px solid var(--ln);color:var(--mu);font-size:14px;font-weight:500}
.lo2:hover{color:var(--no);border-color:color-mix(in srgb,var(--no) 40%,var(--ln))}.lo2 svg{width:16px;height:16px}
.rmeta{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:4px}
.chipg{font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--sf);color:var(--fg)}
.rrow .t3{display:block;font-size:12px;color:var(--fa);margin-top:3px}
.steps{margin:0;padding:0;list-style:none;counter-reset:st}
.steps li{position:relative;padding:0 0 22px 40px;counter-increment:st}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:counter(st);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--fg);color:var(--card);display:grid;place-items:center;font-size:12px;font-weight:600}
.steps li:not(:last-child)::after{content:"";position:absolute;left:12.5px;top:30px;bottom:6px;width:1px;background:var(--ln)}
.steps b{display:block;font-weight:500;margin-bottom:2px}.steps span{display:block;font-size:13px;color:var(--mu)}
.steps a{text-decoration:underline;text-underline-offset:2px;color:var(--fg)}
.steps .btn{text-decoration:none}
.qrw{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:12px}
.qr{flex:none;width:184px;height:184px;padding:8px;background:#fff;border-radius:12px;border:1px solid var(--ln);display:grid;place-items:center}
.qr img,.qr canvas{display:block}
.qrk{flex:1;min-width:180px}.qrk code{display:block;font:500 14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;word-break:break-all;background:var(--sf);border-radius:10px;padding:10px 12px;color:var(--fg)}
.otp{font:500 22px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.5em;text-align:center}
.ic.ok2{background:color-mix(in srgb,var(--ok) 14%,var(--card));color:var(--ok)}
.rules{display:grid;gap:14px;margin-top:18px}
.rule{display:flex;gap:12px;align-items:flex-start}.rule .ic{width:36px;height:36px;border-radius:11px}.rule .ic svg{width:17px;height:17px}
.rule b{display:block;font-weight:500}.rule span{display:block;font-size:13px;color:var(--mu)}
.agree{display:flex;gap:10px;align-items:center;margin-top:20px;font-size:14px;cursor:pointer}.agree input{width:18px;height:18px;accent-color:var(--fg)}
.viol{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;margin-bottom:12px;border-radius:16px;border:1px solid color-mix(in srgb,var(--no) 40%,var(--ln));background:color-mix(in srgb,var(--no) 8%,var(--card));color:var(--no)}
.viol svg{flex:none;width:20px;height:20px;margin-top:1px}.viol b{display:block}.viol span{display:block;font-size:13px;color:var(--mu)}
.chipg.vio{background:color-mix(in srgb,var(--no) 12%,var(--card));color:var(--no)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,10,12,.45);display:grid;place-items:center;padding:20px;backdrop-filter:blur(4px)}
.mbox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:22px}
.mbox .sub{margin-top:8px}
body.secure{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.appb{display:flex;align-items:center;gap:12px;margin:-8px 0 18px;padding:10px 10px 10px 12px;border-radius:16px;border:1px solid var(--ln);background:linear-gradient(135deg,color-mix(in srgb,#3DDC84 10%,var(--card)),var(--card) 70%);box-shadow:var(--sh)}
.appb .apic{flex:none;width:38px;height:38px;border-radius:12px;background:#3DDC84;color:#0b2e1a;display:grid;place-items:center;box-shadow:0 6px 16px -8px rgba(61,220,132,.9)}
.appb .apic svg{width:22px;height:22px}
.appb .tx{flex:1;min-width:0}.appb .t1{display:block;font-size:14px;font-weight:500;line-height:1.3}.appb .t2{display:block;font-size:12px;color:var(--mu)}
.appb .apdl{flex:none;width:34px;height:34px;border-radius:10px;background:var(--fg);color:var(--card);display:grid;place-items:center}.appb .apdl svg{width:16px;height:16px}
.appb .apx{flex:none;width:26px;height:34px;display:grid;place-items:center;color:var(--fa)}.appb .apx svg{width:14px;height:14px}
.pg.ro button{cursor:default}

.fapp:hover{color:var(--fg);border-color:var(--fa)}.fapp svg{width:14px;height:14px;color:#3DDC84}

let QRLIB=null;

async function twofa(kind,token){const box=document.createElement('div');box.innerHTML=`<div class="sec">Двухфакторная защита (2FA)</div><div class="card" id="tf"><div class="ld" style="padding:8px">Загрузка…</div></div>`;main().appendChild(box);
 const C=()=>document.getElementById('tf');
 const st=async()=>{let r;try{r=await rpc('totp_status',{p_kind:kind,p_token:token})}catch(e){C().innerHTML='<div class="empty">Нет связи с сервером</div>';return}
  if(!r.ok){C().innerHTML='<div class="empty">Сессия устарела. Войдите заново.</div>';return}
  r.enabled?on():off()};
 const off=()=>{C().innerHTML=`<div class="prof"><span class="ic">${I.lock}</span><div><div class="t1" style="font-weight:500">Защита выключена</div><div class="sub" style="font-size:13px;margin-top:2px">Включите 2FA: при входе кроме пароля понадобится код из приложения Google Authenticator.</div></div></div><button class="btn mt16" id="tfon">${I.shield} Включить 2FA</button><div class="err" id="tfer"></div>`;
  document.getElementById('tfon').onclick=setup};
 const on=()=>{C().innerHTML=`<div class="prof"><span class="ic ok2">${I.shield}</span><div><div class="t1" style="font-weight:500">Защита включена</div><div class="sub" style="font-size:13px;margin-top:2px">При каждом входе нужен код из Google Authenticator.</div></div></div>
  <label class="lbl" for="tfc">Чтобы отключить, введите текущий код</label><input class="in otp" id="tfc" inputmode="numeric" maxlength="6" placeholder="000000"><button class="btn dg mt16" id="tfoff">Отключить 2FA</button><div class="err" id="tfer"></div>`;
  document.getElementById('tfoff').onclick=async()=>{const c=document.getElementById('tfc').value.replace(/\D/g,''),er=document.getElementById('tfer');if(c.length!==6)return er.textContent='Введите 6-значный код';
   try{const r=await rpc('totp_enable',{p_kind:kind,p_token:token,p_code:c,p_on:false});if(r.ok)off();else er.textContent=r.error==='bad_otp'?'Неверный код':'Сессия устарела. Войдите заново.'}catch(e){er.textContent='Нет связи с сервером'}}};
 const setup=async()=>{let r;try{r=await rpc('totp_setup',{p_kind:kind,p_token:token})}catch(e){document.getElementById('tfer').textContent='Нет связи с сервером';return}
  if(!r.ok){document.getElementById('tfer').textContent='Сессия устарела. Войдите заново.';return}
  const uri=`otpauth://totp/${encodeURIComponent('Testru:'+r.account)}?secret=${r.secret}&issuer=Testru&algorithm=SHA1&digits=6&period=30`,key=r.secret.replace(/(.{4})/g,'$1 ').trim();
  C().innerHTML=`<ol class="steps">
   <li><b>Установите Google Authenticator</b><span>Скачайте бесплатное приложение: <a href="https://play.google.com/store/apps/details?id=com.google.android.apps.authenticator2" target="_blank" rel="noopener">Android (Google Play)</a> или <a href="https://apps.apple.com/app/google-authenticator/id388497605" target="_blank" rel="noopener">iPhone (App Store)</a>.</span></li>
   <li><b>Добавьте аккаунт</b><span>В приложении нажмите «+» → «Сканировать QR-код» и наведите камеру на код ниже. Если сайт открыт на этом же телефоне — нажмите «Открыть в Authenticator» или выберите «Ввести ключ настройки» и вставьте ключ.</span>
    <div class="qrw"><div id="qr" class="qr"></div><div class="qrk"><span class="lbl" style="margin:0 0 4px">Ключ настройки</span><code id="sk">${key}</code><div class="erow" style="margin-top:10px"><button class="btn gh sm" id="cp">Скопировать ключ</button><a class="btn gh sm" href="${uri}">Открыть в Authenticator</a></div></div></div></li>
   <li><b>Подтвердите код</b><span>Введите 6 цифр, которые показывает приложение для «Testru».</span>
    <input class="in otp mt16" id="tfc" inputmode="numeric" maxlength="6" placeholder="000000"><div class="nav"><button class="btn gh" id="tfx">Отмена</button><button class="btn" id="tfok">Подтвердить</button></div><div class="err" id="tfer"></div></li></ol>`;
  loadQR().then(()=>{new QRCode(document.getElementById('qr'),{text:uri,width:168,height:168,correctLevel:QRCode.CorrectLevel.M})}).catch(()=>{document.getElementById('qr').innerHTML='<div class="sub" style="font-size:12px;padding:10px">QR-код не загрузился — введите ключ вручную.</div>'});
  document.getElementById('cp').onclick=()=>{try{navigator.clipboard.writeText(r.secret);document.getElementById('cp').textContent='Скопировано'}catch(e){}};
  document.getElementById('tfx').onclick=off;
  document.getElementById('tfok').onclick=async()=>{const c=document.getElementById('tfc').value.replace(/\D/g,''),er=document.getElementById('tfer');if(c.length!==6)return er.textContent='Введите 6-значный код';
   try{const x=await rpc('totp_enable',{p_kind:kind,p_token:token,p_code:c,p_on:true});if(x.ok)on();else er.textContent=x.error==='bad_otp'?'Неверный код. Проверьте, что время на телефоне установлено автоматически.':'Сессия устарела. Войдите заново.'}catch(e){er.textContent='Нет связи с сервером'}}};
 st()}
