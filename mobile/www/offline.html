<!doctype html>
<html lang="tg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>МТМУ №7</title>
  <style>
    /* The portal's night canvas and brass (src/styles/globals.css), still. */
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: grid; place-items: center; text-align: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background: #0a0e17;
      color: #eee9df; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 320px; }
    .icon {
      display: grid; place-items: center; width: 56px; height: 56px; margin: 0 auto 20px;
      border: 1px solid #313c52; border-radius: 999px; color: #d9be8c;
    }
    .icon svg { width: 24px; height: 24px; }
    h1 { margin: 0 0 6px; font-size: 19px; font-weight: 600; }
    p { margin: 0 0 4px; color: #babec9; font-size: 14px; }
    .muted { color: #8a93a6; font-size: 13px; }
    button {
      margin-top: 24px; min-height: 44px; padding: 0 24px; border: 1px solid #a58550; border-radius: 8px;
      background: #c8a46a; color: #15110a; font: inherit; font-weight: 600; cursor: pointer;
    }
    button:focus-visible { outline: 2px solid #d9be8c; outline-offset: 2px; }
    .waiting { margin-top: 14px; font-size: 12px; color: #8a93a6; }
  </style>
</head>
<body>
  <main>
    <span class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><path d="m2 2 20 20"/>
      </svg>
    </span>
    <h1>Пайвасти интернет нест</h1>
    <p>Пайвастро санҷед — барнома худаш бармегардад.</p>
    <p class="muted">Нет подключения к интернету · No connection</p>
    <button type="button" id="retry">Аз нав кӯшиш кардан</button>
    <p class="waiting" id="waiting">Интизори пайваст…</p>
  </main>
  <script>
    var HOME = "https://mtmuraqami7.vercel.app/dashboard";
    function go() { location.href = HOME; }
    document.getElementById("retry").addEventListener("click", go);
    // Back by itself the moment the phone is online again, and a gentle check
    // every few seconds for the networks that never announce it.
    window.addEventListener("online", go);
    setInterval(function () {
      if (!navigator.onLine) return;
      fetch(HOME, { method: "HEAD", mode: "no-cors", cache: "no-store" }).then(go, function () {});
    }, 6000);
  </script>
</body>
</html>
