name: Android app

on:
  push:
    branches: [testru]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create signing key
        run: |
          PASS=$(openssl rand -hex 16)
          echo "::add-mask::$PASS"
          echo "KEYSTORE_PASS=$PASS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias testru -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Testru, O=Testru, C=TJ"

      - name: Build APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk testru.apk

      - uses: actions/upload-artifact@v4
        with:
          name: testru-apk
          path: testru.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: testru-app
          target_commitish: ${{ github.sha }}
          name: Testru — приложение для Android
          body: |
            Защищённое приложение для https://testru.vercel.app
            Скачайте testru.apk, откройте файл на телефоне и разрешите установку.
            Сборка №${{ github.run_number }}.
          files: testru.apk
          make_latest: false

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: testru-apk

      - name: Check signature and manifest
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs testru.apk
          "$BT/aapt2" dump badging testru.apk | head -20

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Install and launch on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r testru.apk
            adb shell pm list packages | grep tj.testru.app
            adb logcat -c
            adb shell monkey -p tj.testru.app -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell pidof tj.testru.app && echo "APP IS RUNNING"
            adb exec-out screencap -p > screen.png || true
            adb logcat -d -s AndroidRuntime:E chromium:E ActivityManager:W > logcat.txt || true
            grep -i "FATAL EXCEPTION" logcat.txt && exit 1 || echo "no crash"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-check
          path: |
            screen.png
            logcat.txt
