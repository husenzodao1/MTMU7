name: CI

on:
  push:
    branches: [main, "platform/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-1234567890
      NEXT_PUBLIC_APP_URL: https://example.invalid
      CRON_SECRET: ci-placeholder-cron-secret-12345678901234567890
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:db
      - run: npm run db:types -- --check
      - run: node scripts/i18n/check-messages.mts
      - run: node scripts/i18n/check-usage.mts
      - run: npm run security:secrets
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Smoke check (every public page at phone, tablet and computer widths)
        run: |
          npm start &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3000/login && break; sleep 1; done
          npm run test:smoke
