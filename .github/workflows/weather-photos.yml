# Temporary: fetches the greeting card's weather photos where the internet is
# open (scripts/photos/fetch.mjs) and commits them back to the branch.
name: Weather photos

on:
  push:
    branches: [ccr-79d6bc56-dvv8i0]
    paths: ["scripts/photos/**", ".github/workflows/weather-photos.yml"]

permissions:
  contents: write

jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, '[photos-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Only sharp, beside the script: the portal's own dependencies are not needed.
      - run: echo '{"private":true}' > scripts/photos/package.json && npm i --prefix scripts/photos --no-package-lock sharp@0.33.5
      - run: node scripts/photos/fetch.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in scripts/photos/sheets src/features/dashboard/weather-photos; do [ -e "$path" ] && git add "$path"; done
          git commit -m "Weather photos fetched [photos-bot]" || exit 0
          git push
