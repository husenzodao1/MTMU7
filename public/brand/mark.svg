<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- МТМУ №7 · the mark alone, transparent, for placing on any background. Three strokes and nothing else: the two leaves of
       an open book, and above them a warm dot — a head bent over the page, the
       sun over the school. Deep indigo turning to teal behind, a warm glow
       where the dot is. Square; each platform rounds the corners itself. -->
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#231a5c"/>
      <stop offset="0.5" stop-color="#17306d"/>
      <stop offset="1" stop-color="#0a6d72"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.45">
      <stop offset="0" stop-color="#ffb547" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffb547" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dot" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bff3ea"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="190" r="46" fill="url(#dot)"/>
  <path d="M256 372 C 222 318, 164 296, 98 300" fill="none" stroke="url(#leaf)" stroke-width="34" stroke-linecap="round"/>
  <path d="M256 372 C 290 318, 348 296, 414 300" fill="none" stroke="url(#leaf)" stroke-width="34" stroke-linecap="round"/>
</svg>
