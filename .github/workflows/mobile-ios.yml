name: Mobile app · iPhone

# Builds the iPhone app in mobile/ on a Mac runner.
#
# Always: a build for the iOS simulator, unsigned — proof that the project
# compiles, with no Apple account needed.
# With the App Store secrets: a signed archive, uploaded straight to App Store
# Connect (TestFlight), with Xcode's cloud signing making the certificate and
# profile itself.
#
# Optional repository secrets:
#   GOOGLE_SERVICE_INFO_PLIST   Firebase → Project settings → iOS app →
#                               GoogleService-Info.plist (as-is or base64)
#   APPLE_TEAM_ID               developer.apple.com → Membership → Team ID
#   ASC_KEY_ID                  App Store Connect → Users and Access →
#   ASC_ISSUER_ID                 Integrations → App Store Connect API
#   ASC_KEY_P8_BASE64           the downloaded AuthKey_XXXX.p8, base64-encoded
#
# Mac minutes cost ten times Linux ones on private repositories, so this runs
# only when the iPhone side changes, or when started by hand.

on:
  push:
    paths:
      - "mobile/ios/**"
      - "mobile/capacitor.config.json"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - ".github/workflows/mobile-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Firebase (notifications)
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "::notice::GOOGLE_SERVICE_INFO_PLIST is not set: the app builds without notifications."
            exit 0
          fi
          if printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | head -c 5 | grep -q '<'; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/App/App/GoogleService-Info.plist
          else
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 -D > ios/App/App/GoogleService-Info.plist
          fi
          # The file has to be part of the app target to be bundled.
          gem list -i xcodeproj > /dev/null || gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            target = project.targets.find { |t| t.name == "App" }
            group = project.main_group.find_subpath("App", false)
            unless group.files.any? { |f| f.path == "GoogleService-Info.plist" }
              ref = group.new_reference("GoogleService-Info.plist")
              target.add_resources([ref])
              project.save
            end
          '

      - run: npx cap sync ios

      - name: Simulator build (unsigned)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0

      - name: App Store key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$ASC_KEY_P8_BASE64" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::notice::No App Store Connect key: TestFlight upload skipped."
            exit 0
          fi
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          echo "APP_STORE_UPLOAD=1" >> "$GITHUB_ENV"

      - name: Archive and upload to TestFlight
        if: env.APP_STORE_UPLOAD == '1'
        working-directory: mobile/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$APP_VERSION_NAME" CURRENT_PROJECT_VERSION="$APP_VERSION_CODE" \
            "${AUTH[@]}" archive | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0
