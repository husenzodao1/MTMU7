name: Mobile app · Android

# Builds the Android app in mobile/ on every change to it, and on demand.
#
# Always: a debug APK that installs on any phone ("allow unknown apps"), for
# trying the app before it is in the store.
# With signing secrets: a signed release APK and the AAB Google Play takes.
#
# Optional repository secrets (Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICES_JSON        Firebase → Project settings → Android app →
#                               google-services.json (paste as-is or base64)
#   ANDROID_KEYSTORE_BASE64     the upload keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD   its password
#   ANDROID_KEY_ALIAS           the key's alias
#   ANDROID_KEY_PASSWORD        the key's password
# Without them the build still runs: no notifications, no release artifacts.

on:
  push:
    paths:
      - "mobile/**"
      - "!mobile/ios/**"
      - "public/brand/**"
      - ".github/workflows/mobile-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            mobile/android/*.gradle*
            mobile/android/**/gradle-wrapper.properties

      - run: npm ci

      - name: Firebase (notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::notice::GOOGLE_SERVICES_JSON is not set: the app builds without notifications."
            exit 0
          fi
          if printf '%s' "$GOOGLE_SERVICES_JSON" | head -c 1 | grep -q '{'; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          fi

      - run: npx cap sync android

      - name: Release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice::No keystore: only the debug APK is built."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "SIGNED_RELEASE=1" >> "$GITHUB_ENV"

      # The debug key signs the downloadable APK until a release keystore is
      # given. Kept between runs so a phone that has the app can take the next
      # build as an update rather than refusing it as a different app.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Release APK and bundle
        if: env.SIGNED_RELEASE == '1'
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: mtmu7-android-debug-${{ env.APP_VERSION_NAME }}
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: env.SIGNED_RELEASE == '1'
        with:
          name: mtmu7-android-release-${{ env.APP_VERSION_NAME }}
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publish to the download link
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'claude/friendly-bell-smakfs'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The signed release build when there is a keystore, the debug one otherwise.
          apk=$(ls android/app/build/outputs/apk/release/*-release.apk 2>/dev/null | head -n 1)
          [ -n "$apk" ] || apk=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$apk" "$RUNNER_TEMP/MTMU7-android.apk"
          gh release view app-latest --repo "$REPO" > /dev/null 2>&1 || \
            gh release create app-latest --repo "$REPO" --title "МТМУ №7 · apps" \
              --notes "The latest Android, Windows and iPhone builds of the МТМУ №7 portal. Download from https://mtmuraqami7.vercel.app/app" || true
          gh release upload app-latest "$RUNNER_TEMP/MTMU7-android.apk" --repo "$REPO" --clobber
